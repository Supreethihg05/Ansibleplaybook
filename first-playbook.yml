
---
- name: My first Ansible playbook
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Display a welcome message
      ansible.builtin.debug:
        msg: "Hello! My first Ansible playbook is working."

    - name: Check the current user
      ansible.builtin.command: whoami
      register: current_user
      changed_when: false

    - name: Display the current user
      ansible.builtin.debug:
        msg: "The current user is {{ current_user.stdout }}"

